<h1 class="text-center">Liste des produits</h1>

<p-button label="Créer produit" (onClick)="onCreate()" class="block text-center"/>

<div class="search-field">
    <input pInputText
        type="text"
        placeholder="Rechercher par nom ou catégorie..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)" />
</div>

<p-dataView #dv [value]="filteredProducts()" [paginator]="true" [rows]="6">
    <ng-template pTemplate="list" let-products>
        @for (product of products; track product.id) {
            <p-card class="block mb-2">
                <div class="flex gap-3">
                    <img [src]="'https://primefaces.org/cdn/primeng/images/demo/product/' + product.image"
                         [alt]="product.name"
                         width="100" height="100"
                         style="object-fit: cover;" />

                    <div class="flex-1">
                        <span class="font-medium text-secondary text-sm">{{ product.category }}</span>
                        <div class="text-lg font-medium text-900 mt-2">{{ product.name }}</div>
                        <p class="text-sm text-600 mt-1">{{ product.description }}</p>

                        <div class="flex align-items-center gap-3 mt-2">
                            <span class="font-bold">{{ product.price | currency:'EUR' }}</span>
                            <p-tag [value]="product.inventoryStatus" [severity]="getSeverity(product.inventoryStatus)" />
                            <span class="text-sm">Stock : {{ product.quantity }}</span>
                        </div>

                        <p-rating [ngModel]="product.rating" [readonly]="true" [cancel]="false" class="mt-2 block"/>
                    </div>
                </div>

                <ng-template pTemplate="footer">
                    <div class="product-footer">
                        <div class="product-footer-group">
                            <p-inputNumber
                                [ngModel]="quantityFor(product)"
                                (ngModelChange)="setQuantity(product, $event)"
                                [min]="1"
                                [showButtons]="true"
                                buttonLayout="horizontal"
                                incrementButtonIcon="pi pi-plus"
                                decrementButtonIcon="pi pi-minus"
                                decrementButtonClass="p-button-outlined"
                                incrementButtonClass="p-button-outlined"
                                inputStyleClass="quantity-stepper-input"
                                class="quantity-stepper" />
                            <p-button label="Ajouter au panier" icon="pi pi-shopping-cart" (onClick)="onAddToCart(product)"/>
                        </div>
                        @if (isAdmin()) {
                            <div class="product-footer-group">
                                <p-button label="Modifier" icon="pi pi-pencil" severity="secondary" [outlined]="true" (onClick)="onUpdate(product)"/>
                                <p-button label="Supprimer" icon="pi pi-trash" severity="danger" [outlined]="true" (onClick)="onDelete(product)"/>
                            </div>
                        }
                    </div>
                </ng-template>
            </p-card>
        }
    </ng-template>
</p-dataView>

<p-dialog [(visible)]="isDialogVisible"
    [style]="{ width: '50vw' }"
    [header]="isCreation ? 'Créer un produit' : 'Modifier le produit'">
    <app-product-form
        [product]="editedProduct()"
        (save)="onSave($event)"
        (cancel)="onCancel()"
    />
</p-dialog>
