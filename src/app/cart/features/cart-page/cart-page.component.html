<h1 class="text-center">Mon panier</h1>

@if (cart().items.length === 0) {
    <p class="text-center">Votre panier est vide.</p>
}

@for (item of cart().items; track item.id) {
    <p-card class="block mb-2">
        <div class="flex justify-content-between align-items-center">
            <div>
                <div class="font-medium text-900">{{ item.product.name }}</div>
                <span class="text-sm text-600">{{ item.product.price | currency:'EUR' }}</span>
                <div class="flex align-items-center gap-2 mt-1">
                    <p-button icon="pi pi-minus" [rounded]="true" [text]="true" (onClick)="onDecrement(item)"/>
                    <span>{{ item.quantity }}</span>
                    <p-button icon="pi pi-plus" [rounded]="true" [text]="true" (onClick)="onIncrement(item)"/>
                </div>
            </div>
            <p-button label="Retirer" icon="pi pi-trash" severity="danger" (onClick)="onRemove(item.product.id)"/>
        </div>
    </p-card>
}
